<!-- TWEAK:START -->
<style id="agent-tweak-styles">
  #agent-tweak-panel { position: fixed; top: 50%; right: 1rem; z-index: 2147483647; width: min(18rem, calc(100vw - 2rem)); padding: 1rem; transform: translateY(-50%); color: #f7f3ec; background: rgba(20, 20, 18, .94); border: 1px solid rgba(255, 137, 82, .45); border-radius: .75rem; box-shadow: 0 1rem 3rem rgba(0, 0, 0, .35); font: 13px/1.4 system-ui, sans-serif; }
  #agent-tweak-panel[hidden] { display: none; }
  #agent-tweak-panel h2 { margin: 0 0 .75rem; color: #ff8952; font: 700 11px/1 ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; }
  #agent-tweak-panel label { display: grid; gap: .3rem; margin: .75rem 0; color: #ded8cd; }
  #agent-tweak-panel output { color: #ffb08b; font: 11px ui-monospace, monospace; }
  #agent-tweak-panel input { width: 100%; accent-color: #ff8952; }
  #agent-tweak-actions { display: flex; gap: .5rem; margin-top: 1rem; }
  #agent-tweak-actions button { flex: 1; padding: .45rem; cursor: pointer; color: #f7f3ec; background: #2b2a26; border: 1px solid #555046; border-radius: .4rem; }
  #agent-tweak-actions button:last-child { color: #ffb08b; border-color: #a85b3e; }
  @media (max-width: 40rem) { #agent-tweak-panel { top: auto; right: 1rem; bottom: 1rem; transform: none; } }
  @media print { #agent-tweak-panel { display: none !important; } }
</style>
<aside id="agent-tweak-panel" aria-label="Visual tweak controls">
  <h2>Tweak</h2>
  <label>Heading size <output data-output="heading">100%</output><input data-key="heading" type="range" min="70" max="150" value="100"></label>
  <label>Body size <output data-output="body">100%</output><input data-key="body" type="range" min="80" max="130" value="100"></label>
  <label>Density <output data-output="density">100%</output><input data-key="density" type="range" min="60" max="140" value="100"></label>
  <label>Roundness <output data-output="roundness">100%</output><input data-key="roundness" type="range" min="0" max="200" value="100"></label>
  <label>Saturation <output data-output="saturation">100%</output><input data-key="saturation" type="range" min="0" max="180" value="100"></label>
  <div id="agent-tweak-actions"><button type="button" data-action="reset">Reset</button><button type="button" data-action="bake">Copy values</button></div>
</aside>
<script id="agent-tweak-script">
(() => {
  const panel = document.querySelector('#agent-tweak-panel');
  const values = { heading: 100, body: 100, density: 100, roundness: 100, saturation: 100 };
  const originals = new Map();
  const target = selector => [...document.querySelectorAll(selector)].filter(node => !node.closest('#agent-tweak-panel'));
  const remember = (node, property) => {
    const key = `${property}:${target.length}`;
    if (!originals.has(node)) originals.set(node, {});
    if (!(property in originals.get(node))) originals.get(node)[property] = node.style[property];
  };
  const scale = (selector, property, value) => target(selector).forEach(node => {
    remember(node, property);
    const base = parseFloat(getComputedStyle(node)[property]);
    if (base) node.style[property] = `${base * value / 100}px`;
  });
  const apply = () => {
    originals.forEach((styles, node) => Object.entries(styles).forEach(([property, value]) => { node.style[property] = value; }));
    originals.clear();
    if (values.heading !== 100) scale('h1, h2, .display, .hero-title', 'fontSize', values.heading);
    if (values.body !== 100) scale('p, li, .body, .body-text', 'fontSize', values.body);
    if (values.density !== 100) target('main, section, .container, .grid, .stack').forEach(node => {
      remember(node, 'padding'); remember(node, 'gap');
      const style = getComputedStyle(node);
      const padding = parseFloat(style.paddingTop);
      const gap = parseFloat(style.gap);
      if (padding) node.style.padding = `${padding * values.density / 100}px`;
      if (gap) node.style.gap = `${gap * values.density / 100}px`;
    });
    if (values.roundness !== 100) target('*').forEach(node => {
      const radius = parseFloat(getComputedStyle(node).borderRadius);
      if (!radius) return;
      remember(node, 'borderRadius');
      node.style.borderRadius = `${radius * values.roundness / 100}px`;
    });
    remember(document.body, 'filter');
    document.body.style.filter = values.saturation === 100 ? '' : `saturate(${values.saturation / 100})`;
  };
  const update = input => {
    values[input.dataset.key] = Number(input.value);
    panel.querySelector(`[data-output="${input.dataset.key}"]`).textContent = `${input.value}%`;
    apply();
  };
  panel.querySelectorAll('input').forEach(input => input.addEventListener('input', () => update(input)));
  panel.querySelector('[data-action="reset"]').addEventListener('click', () => {
    panel.querySelectorAll('input').forEach(input => { input.value = 100; update(input); });
  });
  panel.querySelector('[data-action="bake"]').addEventListener('click', async () => {
    const changed = Object.fromEntries(Object.entries(values).filter(([, value]) => value !== 100));
    const payload = `AGENT_TWEAK_v1\n${JSON.stringify({ values: changed }, null, 2)}`;
    try { await navigator.clipboard.writeText(payload); panel.querySelector('[data-action="bake"]').textContent = 'Copied'; }
    catch { window.prompt('Copy these values into your agent:', payload); }
  });
  document.addEventListener('keydown', event => {
    if (event.target.matches('input, textarea, select, [contenteditable="true"]')) return;
    if (event.key.toLowerCase() === 't') panel.hidden = !panel.hidden;
    if (event.key.toLowerCase() === 'r') panel.querySelector('[data-action="reset"]').click();
    if (event.key.toLowerCase() === 'b') panel.querySelector('[data-action="bake"]').click();
  });
})();
</script>
<!-- TWEAK:END -->
